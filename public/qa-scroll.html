<!doctype html>
<html><head><meta charset="utf-8"><style>html,body,iframe{width:100%;height:100%;margin:0;border:0;overflow:hidden}</style></head>
<body><iframe id="site" src="/"></iframe><script>
const frame=document.getElementById('site');
const id=new URLSearchParams(location.search).get('target')||'posicionamento';
frame.addEventListener('load',()=>setTimeout(()=>{
  const target=frame.contentDocument.getElementById(id);
  if(target) frame.contentWindow.scrollTo({top:target.offsetTop-frame.contentWindow.innerHeight*.72,behavior:'instant'});
},1500));
</script></body></html>
